<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Transaksi - TechMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/" class="btn btn-secondary mb-3">&larr; Kembali ke Beranda</a>
        <h2 class="mb-4">Daftar Detail Transaksi</h2>
        <div class="card shadow p-4">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID Detail</th>
                        <th>ID Transaksi</th>
                        <th>Nama Produk</th>
                        <th>Jumlah (Qty)</th>
                        <th>Subtotal (Rp)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for dt in detail %}
                    <tr>
                        <td>{{ dt.id_detail }}</td>
                        <td>{{ dt.id_transaksi }}</td>
                        <td>{{ dt.nama_produk }}</td>
                        <td>{{ dt.jml }}</td>
                        <td>Rp {{ "{:,}".format(dt.subtotal).replace(',', '.') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
