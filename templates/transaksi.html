<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Transaksi - TechMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Kembali ke Beranda</a>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-credit-card"></i> Daftar Transaksi</h2>
            <a href="/transaksi/tambah" class="btn btn-primary shadow-sm"><i class="bi bi-plus-lg"></i> Transaksi Baru</a>
        </div>

        <div class="card shadow border-0 p-4 rounded-4">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal</th>
                        <th>Nama Pelanggan</th>
                        <th>Total Bayar (Rp)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in transaksi %}
                    <tr>
                        <td>{{ t.id_transaksi }}</td>
                        <td>{{ t.tanggal_transaksi }}</td>
                        <td class="fw-semibold">{{ t.nama_pelanggan }}</td>
                        <td class="text-success fw-bold">Rp {{ "{:,}".format(t.total_bayar).replace(',', '.') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
