<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Produk - TechMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4 rounded-4">
                    <h3 class="mb-4 text-center fw-bold"><i class="bi bi-pencil-square text-warning"></i> Edit Data Produk</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama Produk</label>
                            <input type="text" name="nama_produk" value="{{ produk.nama_produk }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Kategori</label>
                            <select name="kategori" class="form-select" required>
                                <option value="Laptop" {% if produk.kategori == 'Laptop' %}selected{% endif %}>Laptop</option>
                                <option value="Aksesoris" {% if produk.kategori == 'Aksesoris' %}selected{% endif %}>Aksesoris</option>
                                <option value="Monitor" {% if produk.kategori == 'Monitor' %}selected{% endif %}>Monitor</option>
                                <option value="Storage" {% if produk.kategori == 'Storage' %}selected{% endif %}>Storage</option>
                                <option value="Audio" {% if produk.kategori == 'Audio' %}selected{% endif %}>Audio</option>
                                <option value="Jaringan" {% if produk.kategori == 'Jaringan' %}selected{% endif %}>Jaringan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Harga (Rp)</label>
                            <input type="number" name="harga" value="{{ produk.harga }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Stok</label>
                            <input type="number" name="stok" value="{{ produk.stok }}" class="form-control" required>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/produk" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Batal</a>
                            <button type="submit" class="btn btn-warning text-white"><i class="bi bi-check-circle"></i> Perbarui Data</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
