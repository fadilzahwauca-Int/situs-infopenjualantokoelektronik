<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TechMart Electronics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow border-0 rounded-4 p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex p-3 mb-2">
                                <i class="bi bi-key fs-1"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Reset Password</h3>
                            <p class="text-muted small">Masukkan akun dan password baru Anda</p>
                        </div>
                        <form action="/forgot-password" method="POST">
                            <div class="mb-3">
                                <label for="username_or_email" class="form-label fw-semibold">Username atau Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" id="username_or_email" name="username_or_email" class="form-control border-start-0" placeholder="Masukkan username/email terdaftar" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="new_password" class="form-label fw-semibold">Password Baru</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" id="new_password" name="new_password" class="form-control border-start-0" placeholder="Minimal 6 karakter" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="confirm_new_password" class="form-label fw-semibold">Konfirmasi Password Baru</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                                    <input type="password" id="confirm_new_password" name="confirm_new_password" class="form-control border-start-0" placeholder="Ulangi password baru" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 py-2 rounded-3 fw-semibold text-white shadow-sm">
                                <i class="bi bi-arrow-clockwise me-1"></i> Perbarui Password
                            </button>
                        </form>
                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Sudah ingat password? <a href="/login" class="text-primary fw-semibold text-decoration-none">Masuk di sini</a></p>
                        </div>
                    </div>
                </div>
                <p class="text-center text-muted small mt-4">&copy; 2026 TechMart Electronics Store</p>
            </div>
        </div>
    </div>
</body>
</html>
