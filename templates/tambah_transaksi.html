<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Transaksi Baru - TechMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4 rounded-4">
                    <h3 class="mb-4 text-center fw-bold">
                        <i class="bi bi-cart-plus text-primary"></i> Transaksi Penjualan Baru
                    </h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Pilih Pelanggan</label>
                            <select name="id_pelanggan" class="form-select" required>
                                <option value="" disabled selected>-- Pilih Pelanggan / Member --</option>
                                {% for pl in pelanggan %}
                                    <option value="{{ pl.id_pelanggan }}">{{ pl.nama_pelanggan }} (ID: {{ pl.id_pelanggan }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Pilih Produk Elektronik</label>
                            <select name="id_produk" class="form-select" required>
                                <option value="" disabled selected>-- Pilih Barang Elektronik --</option>
                                {% for p in produk %}
                                    <option value="{{ p.id_produk }}">
                                        {{ p.nama_produk }} - Rp {{ "{:,}".format(p.harga).replace(',', '.') }} (Stok: {{ p.stok }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Jumlah (Qty)</label>
                            <input type="number" name="jml" class="form-control" min="1" placeholder="Contoh: 1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tanggal Transaksi</label>
                            <input type="date" name="tanggal_transaksi" class="form-control" required>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/transaksi" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Batal
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Simpan Transaksi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
