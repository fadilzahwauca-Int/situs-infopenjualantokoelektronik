<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TechMart Electronics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4 p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex p-3 mb-2">
                                <i class="bi bi-person-plus fs-1"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Buat Akun Baru</h3>
                            <p class="text-muted small">Daftarkan akun admin atau staf toko Anda</p>
                        </div>
                        <form action="/signup" method="POST">
                            <div class="mb-3">
                                <label for="nama_lengkap" class="form-label fw-semibold">Nama Lengkap</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-heading text-muted"></i></span>
                                    <input type="text" id="nama_lengkap" name="nama_lengkap" class="form-control border-start-0" placeholder="Contoh: Ahmad Kasir" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="Pilih username" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Alamat Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="nama@email.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="Minimal 6 karakter" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label fw-semibold">Konfirmasi Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                                    <input type="password" id="confirm_password" name="confirm_password" class="form-control border-start-0" placeholder="Ulangi password" required>
                                </div>
                            </div>
                            <div class="form-check mb-4">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label small text-muted" for="terms">
                                    Saya menyetujui <a href="/terms" target="_blank" class="text-decoration-none">Syarat & Ketentuan</a> yang berlaku.
                                </label>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-semibold shadow-sm">
                                <i class="bi bi-check-circle me-1"></i> Daftar Sekarang
                            </button>
                        </form>
                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Sudah punya akun? <a href="/login" class="text-success fw-semibold text-decoration-none">Masuk di sini</a></p>
                        </div>
                    </div>
                </div>
                <p class="text-center text-muted small mt-4">&copy; 2026 TechMart Electronics Store</p>
            </div>
        </div>
    </div>
</body>
</html>
