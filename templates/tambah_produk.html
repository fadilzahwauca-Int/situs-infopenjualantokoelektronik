<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Produk - TechMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4 rounded-4">
                    <h3 class="mb-4 text-center fw-bold"><i class="bi bi-plus-circle text-success"></i> Tambah Produk Baru</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama Produk</label>
                            <input type="text" name="nama_produk" class="form-control" placeholder="Contoh: Laptop ASUS ROG" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Kategori</label>
                            <select name="kategori" class="form-select" required>
                                <option value="" disabled selected>-- Pilih Kategori Elektronik --</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Aksesoris">Aksesoris</option>
                                <option value="Monitor">Monitor</option>
                                <option value="Storage">Storage</option>
                                <option value="Audio">Audio</option>
                                <option value="Jaringan">Jaringan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Harga (Rp)</label>
                            <input type="number" name="harga" class="form-control" placeholder="Contoh: 15000000" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Stok</label>
                            <input type="number" name="stok" class="form-control" placeholder="Contoh: 20" required>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/produk" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Batal</a>
                            <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Simpan Produk</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
